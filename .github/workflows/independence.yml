name: Independence

# This library implements the PubGrub algorithm from its published prose
# descriptions rather than from another implementation's source.
#
# Only one part of that is mechanically checkable, and this workflow checks it.
# Everything else is checked locally, before merge, by the independence-audit
# skill -- see CONTRIBUTING.md.
#
# This workflow used to also require a ticked confirmation in the pull request
# description. That check is gone. The description is written by the author, so
# it asked the author to gate the author, and an agent wanting a green build
# ticked it -- twice. A gate that the thing being gated can open is not a gate,
# and leaving it in place implied an assurance that did not exist.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # If another solver implementation ever enters the module graph, something
      # has gone wrong regardless of what any pull request says. This costs
      # nothing and cannot be talked out of its answer.
      - name: Assert no PubGrub implementation is a dependency
        run: |
          set -euo pipefail
          if grep -nEi 'pubgrub-rs|astral-sh/pubgrub|contriboss/pubgrub|mircearoata/pubgrub|pubgrub-go' go.mod go.sum 2>/dev/null; then
            echo "::error::A PubGrub implementation appears in this module's dependencies."
            exit 1
          fi
          echo "No PubGrub implementation in go.mod or go.sum."
